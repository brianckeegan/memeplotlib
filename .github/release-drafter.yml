name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Each category's label matching lives in `when`, and `semver-increment`
# sets how a matched change bumps $RESOLVED_VERSION (the highest bump wins;
# unmatched changes bump the patch version). This replaces the
# `categories[*].labels` and `version-resolver.*.labels` fields that
# release-drafter v7 deprecates.
categories:
  - title: '⚠️ Breaking changes'
    semver-increment: 'major'
    when:
      labels:
        - 'breaking'
        - 'breaking-change'
        - 'major'
  - title: '🚀 Features'
    semver-increment: 'minor'
    when:
      labels:
        - 'feature'
        - 'enhancement'
        - 'minor'
  - title: '🐛 Bug fixes'
    semver-increment: 'patch'
    when:
      labels:
        - 'fix'
        - 'bug'
        - 'patch'
  - title: '📚 Documentation'
    when:
      labels:
        - 'docs'
        - 'documentation'
  - title: '🏠 Internal'
    when:
      labels:
        - 'chore'
        - 'internal'
        - 'dependencies'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

template: |
  ## What's changed

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
