name: Publish to Conda

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: conda
        type: choice
        options:
          - conda
      conda_label:
        description: "Optional Anaconda label (empty uses 'main')"
        required: false
        default: ""
        type: string

jobs:
  publish-conda:
    name: Build and publish conda package
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'conda') ||
      (github.event_name == 'release' && github.event.action == 'published')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Miniforge rather than Anaconda's Miniconda: it uses conda-forge only
      # (no implicit `defaults` channel, which setup-miniconda warns about)
      # and doesn't bundle the conda-pypi plugin behind the "Did you know?"
      # notice. Everything this job installs comes from conda-forge anyway.
      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
          auto-update-conda: true
          activate-environment: build
          python-version: "3.10"

      - name: Install build tools
        shell: bash -el {0}
        run: conda install -y conda-build anaconda-client

      # conda-build lives in the activated "build" env. Call its own entry
      # point: the `conda build` subcommand is only found when conda-build
      # is installed alongside the `conda` that runs it (the base env).
      # Name the channel explicitly: conda-build sees no channels here, so
      # it can't find python/pip/hatchling for the host environment.
      - name: Build conda package
        id: build
        shell: bash -el {0}
        run: |
          conda-build conda-recipe -c conda-forge --override-channels
          echo "package_path=$(conda-build conda-recipe -c conda-forge --override-channels --output)" >> "$GITHUB_OUTPUT"

      - name: Upload package to Anaconda
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANACONDA_API_TOKEN:-}" ]; then
            echo "ANACONDA_API_TOKEN secret is required to publish conda packages."
            exit 1
          fi

          LABEL="${{ github.event.inputs.conda_label || 'main' }}"
          anaconda --token "$ANACONDA_API_TOKEN" upload --user "$GITHUB_REPOSITORY_OWNER" --label "$LABEL" --skip-existing "${{ steps.build.outputs.package_path }}"
