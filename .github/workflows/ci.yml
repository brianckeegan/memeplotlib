name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs,mcp]"

      - name: Configure matplotlib backend (Linux)
        if: runner.os == 'Linux'
        run: echo "MPLBACKEND=Agg" >> "$GITHUB_ENV"

      - name: Run pytest with coverage and image comparison
        run: pytest --cov --mpl --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev + mcp extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .

      - name: mypy --strict
        run: mypy --strict src/memeplotlib

  docs:
    name: docs (sphinx -W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build Sphinx with -W
        run: sphinx-build -W docs docs/_build

  build:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify wheel includes the Anton font and license
        run: |
          unzip -l dist/*.whl | tee /tmp/wheel-files
          grep -q "memeplotlib/fonts/Anton-Regular.ttf" /tmp/wheel-files
          grep -q "LICENSE" /tmp/wheel-files

      - name: Validate metadata with twine check
        run: twine check dist/*

      - name: Install wheel in fresh venv and run tests
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/pip install pytest pytest-mock responses pytest-mpl pytest-httpserver pytest-socket
          cd /tmp
          /tmp/wheel-venv/bin/python -m pytest --pyargs memeplotlib || true
          # Fall back to a smoke import if no pyargs-discoverable tests
          /tmp/wheel-venv/bin/python -c "import memeplotlib; print(memeplotlib.__version__)"
