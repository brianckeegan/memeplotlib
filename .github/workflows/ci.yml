name: CI

# Every push and pull request gets the cheap checks only: ruff, black and
# mypy --strict. The full OS x Python test matrix, the docs build and the
# wheel check live in release-tests.yml and run before each PyPI release
# (or on demand from the Actions tab).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint, format, types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev + mcp extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .

      - name: mypy --strict
        run: mypy --strict src/memeplotlib
